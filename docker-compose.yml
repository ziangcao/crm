services:
  crm:
    build: .
    ports:
      - "127.0.0.1:${CRM_BIND_PORT:-8000}:8000"
    environment:
      CRM_HOST: 0.0.0.0
      CRM_DB_DRIVER: postgres
      CRM_DB_DSN: postgres://crm:${CRM_DB_PASSWORD:-crm}@postgres:5432/crm?sslmode=disable
      CRM_COOKIE_SECURE: "${CRM_COOKIE_SECURE:-0}"
      CRM_ALLOWED_ORIGINS: "${CRM_ALLOWED_ORIGINS:-}"
      CRM_FRONTEND: /app/frontend/dist
      CRM_UPLOAD_DIR: /app/uploads
      CRM_GITHUB_IMAGE_OWNER: ${CRM_GITHUB_IMAGE_OWNER:-}
      CRM_GITHUB_IMAGE_REPO: ${CRM_GITHUB_IMAGE_REPO:-}
      CRM_GITHUB_IMAGE_BRANCH: ${CRM_GITHUB_IMAGE_BRANCH:-main}
      CRM_GITHUB_IMAGE_TOKEN: ${CRM_GITHUB_IMAGE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - crm-uploads:/app/uploads
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: "${CRM_DB_PASSWORD:-crm}"
    volumes:
      - crm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  crm-postgres:
  crm-uploads:
